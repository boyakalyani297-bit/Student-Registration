<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One-Day Islamic Workshop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>One-Day Islamic Training Workshop
         Registration Form</h2>

    <form id="registrationForm">

        <!-- Student Name -->
        <label for="studentName">Student Name</label>
        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
            required
        >

        <!-- Student Mobile -->
        <label for="studentMobile">Student Mobile Number</label>
        <input
            type="tel"
            id="studentMobile"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            required
        >

        <!-- Qualification -->
        <label for="qualification">Qualification</label>
<select id="qualification" required>
    <option value="">Select Qualification</option>
    <option value="School">School</option>
    <option value="College">College</option>
</select>

<div id="collegeSection" style="display: none;">
    <label for="college">College</label>
    <select id="college">
        <option value="">Select College Qualification</option>
        <option value="Inter">Inter</option>
          <option value="Diploma">Diploma</option>
        <option value="Degree">Degree</option>
        <option value="Engineering">Engineering</option>
          <option value="Pharmacy">Pharmacy</option>
        <option value="PG/Above">PG/Above</option>
    </select>
</div>

        <!-- Mother Name -->
        <label for="motherName">Mother Name</label>
        <input
            type="text"
            id="motherName"
            placeholder="Enter mother name"
            required
        >
         <!-- Father Name -->
        <label for="fatherName">Father Name</label>
        <input
            type="text"
            id="fatherName"
            placeholder="Enter father name"
            required
        >

        <!-- Parent Mobile -->
        <label for="parentMobile">Parent Mobile Number</label>
        <input
            type="tel"
            id="parentMobile"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            required
        >

        <!-- ADDRESS -->
        <div class="section-heading">ADDRESS</div>

        <!-- Village -->
        <label for="village">Village</label>
        <input
            type="text"
            id="village"
            placeholder="Enter village"
            required
        >

        <!-- Constituency -->
        <label for="constituency">Constituency</label>

        <select id="constituency" required>
            <option value="">Select Constituency</option>
            <option value="Kodad">Kodad</option>
            <option value="Huzurnagar">Huzurnagar</option>
            <option value="Jaggayyapeta">Jaggayyapeta</option>
        </select>

       <div class="form-group">
    <label>Can you read the Qur'an in Arabic?</label>

    <div class="radio-group">
        <label>
            <input type="radio" name="quranArabic" value="Yes" required>
            Yes
        </label>

        <label>
            <input type="radio" name="quranArabic" value="No">
            No
        </label>
    </div>
</div>
<div class="form-group">
    <label for="surahCount">
        How many Qur'an Surahs can you remember by heart?
    </label>

    <select id="surahCount" name="surahCount" required>
        <option value="">Select an option</option>
        <option value="Up to 10">Up to 10</option>
        <option value="Between 11 and 30">Between 11 and 30</option>
        <option value="Between 31 and 114">Between 31 and 114</option>
    </select>
</div>
        <!-- Submit -->
        <button type="submit" id="submitBtn">
            Submit
        </button>

    </form>

</div>


<!-- SUCCESS POPUP -->

<div id="successPopup" class="popup">

    <div class="popup-content">

        <h2>Registration Successful</h2>

        <p id="successMessage"></p>

        <button type="button" onclick="closePopup()">
            OK
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
